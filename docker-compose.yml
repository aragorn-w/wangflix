services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    labels:
    - com.centurylinklabs.watchtower.enable=false
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    # Ports bind to ALL interfaces (0.0.0.0) so Tailnet clients (which
    # talk to the host via the tailscale0 interface, IP 100.x.x.x) can
    # reach the admin UIs alongside the LAN.  A previous attempt to
    # restrict bind-IP to MEDIA_LAN_IP only broke Tailscale access
    # entirely (codex round-module-split #2 reopened AUDIT A10).
    # The "perimeter" relies on:
    #   (1) UFW off + Tailnet Lock on
    #   (2) the host having no public-routable interface
    #   (3) admin UI auth where configured
    # If you replicate on a host with public interface(s) exposed, edit
    # this file to add `${MEDIA_LAN_IP}:HOST:CONTAINER` (and a second
    # binding for your Tailscale IP) before bringing the stack up.
    ports:
    - 8090:8090
    # 54321/tcp+udp removed 2026-09-16.  They published a STATIC port that
    # ProtonVPN never forwarded, so nothing on the internet could reach it; the
    # mapping only documented an inbound path that did not exist.  Inbound peer
    # traffic now arrives on the port Proton actually allocates, which gluetun
    # opens in its own firewall automatically and which is not a host publish.
    - 9696:9696
    - 8989:8989
    - 7878:7878
    - 6767:6767
    - 8192:8191
    # Removed 2026-05-19: 8787 was Readarr's default WebUI port; the
    # Readarr container was disabled 2026-04-28 and never replaced
    # (codex round-5 finding #5).  5000 was Kavita's port — but Kavita
    # was never inside Gluetun's namespace, so the mapping pointed at
    # nothing.  Moved to a direct publish on the kavita service (codex
    # round-9 finding #1).
    dns:
    - 8.8.8.8
    - 1.1.1.1
    environment:
    - VPN_SERVICE_PROVIDER=protonvpn
    - VPN_TYPE=wireguard
    - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?WIREGUARD_PRIVATE_KEY missing — see .env.example}
    - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESS:?WIREGUARD_ADDRESS missing — see .env.example}
    - SERVER_COUNTRIES=${VPN_COUNTRY:-Switzerland}
    # Health checks target IPs, not hostnames.  MITIGATION, not the root fix.
    # gluetun's default targets (cloudflare.com:443, github.com:443) are resolved by the
    # health server through gluetun's OWN DNS at 127.0.0.1:53, so a resolver hiccup fails
    # the liveness check even when the tunnel is perfectly healthy (observed: ICMP 0% loss,
    # HTTPS egress working and nslookup succeeding inside the container, while the check
    # failed on "lookup github.com on 127.0.0.1:53: i/o timeout").  Dialling raw IPs removes
    # resolution from the startup and full periodic checks.  It is not a total DNS removal:
    # if ICMP becomes unavailable the small check can still fall back to a DNS lookup.  Port 443 still does a full TLS handshake, and both
    # certificates cover their IP, so this remains a real end-to-end check rather than a
    # bare socket test.  Verified NOT to weaken tunnel enforcement: both IPs route via tun0
    # (table 51820), OUTPUT defaults to DROP, neither IP falls inside
    # FIREWALL_OUTBOUND_SUBNETS, and connections bound to the container's eth0 time out.
    #
    # The ROOT cause of the permanently-unhealthy state is believed to be a bug in the pinned
    # image rather than DNS: the health checker passes results over an unbuffered channel and
    # can deadlock against its own stop routine, after which recovery never runs again.  The
    # symptoms here are CONSISTENT WITH that upstream deadlock but were not proven against it
    # (no goroutine dump was captured).  Evidence on
    # this host: 5,883 "restarting VPN because it failed to pass the healthcheck" entries
    # that stopped dead on 2026-09-09, while the failing streak kept climbing to 93,585 six
    # days later.  HEALTH_RESTART_VPN does fire - it fired thousands of times - and then
    # stopped for good.  Fixed upstream in v3.41.1 (PR #3123), which is why this service is
    # no longer pinned to the 2026-01-24 build.  Watchtower is still disabled for gluetun
    # (label above) because restarting it drops the netns for seven containers.
    - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,8.8.8.8:443
    # ProtonVPN port forwarding.  Without this qBittorrent is outbound-only: it
    # can dial peers but no peer can ever dial it, which hurts sparse swarms.
    #
    # PORT_FORWARD_ONLY is REQUIRED, not optional.  Proton only forwards on its
    # P2P servers, and SERVER_COUNTRIES alone does not prefer them, so without
    # this gluetun can connect to a perfectly healthy server that will never
    # grant a port and forwarding silently does nothing.
    #
    # A NAT-PMP-ENABLED WIREGUARD KEY IS ALSO REQUIRED.  Proton hands the port
    # out over NAT-PMP (udp/5351) and the key must be generated with that
    # enabled in Proton's dashboard.  As of 2026-09-16 this host's key was NOT,
    # so allocation fails with "connection refused" on 5351 and no port is
    # granted.  gluetun does not retry a failed initial allocation, so after
    # swapping in a NAT-PMP key you must RECREATE gluetun, not just wait.  Checked against
    # gluetun's own embedded server list: Switzerland has 18 port_forward-capable
    # entries out of 28, so this filter still leaves real choice rather than
    # pinning the tunnel to one host.
    #
    # The allocated port is DYNAMIC (Proton: "the port number usually changes
    # when you reconnect"), so there is deliberately no static port anywhere in
    # this file.  sync-forwarded-port.py reconciles qBittorrent's listen port on
    # a timer; see ops/cron.d/media-stack.crontab.  gluetun opens the allocated
    # port in its own firewall, which is why FIREWALL_VPN_INPUT_PORTS is gone.
    #
    # VPN_PORT_FORWARDING_PROVIDER was dropped as redundant: it defaults to
    # VPN_SERVICE_PROVIDER, already protonvpn above.
    - VPN_PORT_FORWARDING=on
    - PORT_FORWARD_ONLY=on
    # gluetun defaults the control server to :::8000, which IS reachable from
    # the host on the container IP (verified: GET /v1/portforward answered 200
    # from outside the namespace).  The auth file grants that route with
    # auth = "none", so pin the listener to loopback to make that safe.
    - HTTP_CONTROL_SERVER_ADDRESS=127.0.0.1:8000
    # LAN + Tailnet CGNAT range.  Inbound to published ports already works
    # via conntrack, but containers in gluetun's namespace that initiate
    # outbound to Tailnet-only services (e.g. host-side Sonarr/Radarr
    # webhooks reachable via 100.x) need this allowlist.  100.64.0.0/10
    # is the CGNAT block Tailscale assigns from (codex round-4 #1).
    # Replicators on a different LAN can override via .env (codex
    # round-10 #5 — was hardcoded to a single host's LAN subnet).
    - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS:-10.0.0.0/24,100.64.0.0/10}
    # Every control-server route is private by default in this gluetun version.
    # config.toml grants exactly one read-only route (GET /v1/portforward) so
    # sync-forwarded-port.py can poll the allocation; nothing else is granted.
    # /gluetun/auth/config.toml is the default path, so no env var is needed.
    volumes:
    - ./ops/gluetun/auth-config.toml:/gluetun/auth/config.toml:ro
    restart: unless-stopped
    networks:
    - internal-media
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-dvr
    network_mode: service:gluetun
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    - WEBUI_PORT=8090
    volumes:
    - ./config/qbittorrent:/config
    - ./data/torrents:/downloads
    restart: unless-stopped
    depends_on:
    - gluetun
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr-dvr
    network_mode: service:gluetun
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ./config/prowlarr:/config
    restart: unless-stopped
    depends_on:
    - gluetun
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: service:gluetun
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ./config/sonarr:/config
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}/tv:/tv
    - ./data/torrents:/downloads
    restart: unless-stopped
    depends_on:
    - gluetun
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: service:gluetun
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ./config/radarr:/config
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}/movies:/movies
    - ./data/torrents:/downloads
    restart: unless-stopped
    depends_on:
    - gluetun
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: service:gluetun
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ./config/bazarr:/config
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}/tv:/tv
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}/movies:/movies
    restart: unless-stopped
    depends_on:
    - gluetun
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr-dvr
    network_mode: service:gluetun
    environment:
    - LOG_LEVEL=info
    - TZ=${TZ:-UTC}
    restart: unless-stopped
    depends_on:
    - gluetun
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    environment:
    - UN_SONARR_0_URL=http://localhost:8989
    - UN_SONARR_0_API_KEY=${SONARR_API_KEY:?SONARR_API_KEY missing — see .env.example}
    - UN_RADARR_0_URL=http://localhost:7878
    - UN_RADARR_0_API_KEY=${RADARR_API_KEY:?RADARR_API_KEY missing — see .env.example}
    volumes:
    - ./data/torrents:/downloads
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
    - gluetun
  watchtower:
    # Forked from containrrr/watchtower 2026-05-23 — upstream is abandoned
    # and ships an old Docker API client (1.25) below the minimum 1.44
    # required by Docker daemon 29.x.  nickfedor/watchtower is the
    # actively-maintained community fork.  Same config interface.
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - WATCHTOWER_CLEANUP=true
    - WATCHTOWER_POLL_INTERVAL=86400
    restart: unless-stopped
    networks:
    - internal-media
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    ports:
    - 8265:8265
    - 8266:8266
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    - serverIP=0.0.0.0
    - disableAnalytics=true
    volumes:
    - ${MEDIA_STACK_ROOT:-$HOME/media-stack}/config/tdarr:/app/server
    - ${MEDIA_STACK_ROOT:-$HOME/media-stack}/config/tdarr_configs:/app/configs
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}:/media
    networks:
    - internal-media
  tdarr-node:
    container_name: tdarr-node
    image: ghcr.io/haveagitgat/tdarr_node:latest
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    - nodeID=Balls3-NVIDIA
    - serverIP=tdarr
    - serverPort=8266
    - disableAnalytics=true
    volumes:
    - ${MEDIA_STACK_ROOT:-$HOME/media-stack}/config/tdarr_node:/app/configs
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}:/media
    - /tmp:/temp
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    depends_on:
    - tdarr
    networks:
    - internal-media
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
    - 8096:8096
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    # Default to the LAN IP so clients at least have a working URL when
    # the operator hasn't set JELLYFIN_PUBLISHED_URL — falling back to a
    # placeholder tailnet name would advertise a non-resolvable host.
    - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-${MEDIA_LAN_IP:-10.0.0.10}}
    volumes:
    - ${MEDIA_STACK_ROOT:-$HOME/media-stack}/config/jellyfin:/config
    - ${MEDIA_ROOT:-${MEDIA_STACK_ROOT:-$HOME/media-stack}/data/media}:/data
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    networks:
    - internal-media
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    networks:
    - internal-media
    ports:
    - 5055:5055
    environment:
    - LOG_LEVEL=debug
    - TZ=${TZ:-UTC}
    volumes:
    - ${MEDIA_STACK_ROOT:-$HOME/media-stack}/config/jellyseerr:/app/config
  # readarr: disabled 2026-04-28 — image pulled from registries (LinuxServer
  # discontinued Readarr after upstream was abandoned). Config still on disk
  # at ./config/readarr if a replacement is chosen later.
  # readarr:
  #   image: lscr.io/linuxserver/readarr:develop
  #   container_name: readarr
  #   network_mode: service:gluetun
  #   environment:
  #   - PUID=${PUID:-1000}
  #   - PGID=${PGID:-1000}
  #   - TZ=${TZ:-UTC}
  #   volumes:
  #   - ./config/readarr:/config
  #   - ${CALIBRE_LIBRARY:-/srv/calibre/library}:/books
  #   - ./data/torrents:/downloads
  #   restart: unless-stopped
  #   depends_on:
  #   - gluetun
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-UTC}
    volumes:
    - ./config/kavita:/config
    - ${CALIBRE_LIBRARY:-/srv/calibre/library}:/books
    restart: unless-stopped
    # Direct host port publish — Kavita reads from /srv/calibre/library
    # and doesn't fetch external content, so routing through Gluetun's
    # VPN namespace is unnecessary.  Previously the 5000:5000 mapping
    # lived on Gluetun (alongside Sonarr/Radarr/Bazarr/qBit), which left
    # host:5000 pointing at Gluetun's empty namespace — Kavita was
    # unreachable from the LAN despite the docs saying otherwise (codex
    # round-9 finding #1).
    ports:
    - 5000:5000
    networks:
    - internal-media
networks:
  internal-media:
    driver: bridge
